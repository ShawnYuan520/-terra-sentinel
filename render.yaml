services:
  - type: web
    name: agrispatial-backend
    runtime: docker
    dockerfilePath: deploy/backend/Dockerfile
    context: backend
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 10000
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./agrispatial.db
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GEE_PROJECT
        sync: false
      - key: GEE_SERVICE_ACCOUNT
        sync: false
      - key: GEE_KEY_FILE
        sync: false
      - key: CORS_ORIGINS
        sync: false
