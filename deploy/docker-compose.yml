# ============================================
# AgriSpatial AI - Docker Compose
# 启动: docker compose up -d
# 查看: docker compose logs -f backend
# ============================================
services:
  # ── PostgreSQL + PostGIS ──
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: agrispatial
      POSTGRES_USER: agrispatial
      POSTGRES_PASSWORD: agrispatial
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrispatial"]
      interval: 5s
      retries: 5

  # ── Redis ──
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  # ── FastAPI Backend ──
  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/backend/Dockerfile
    env_file:
      - ./backend/.env.docker
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Farmer App (农户端 — 唯一前端) ──
  farmer:
    build:
      context: ../frontend/farmer
      dockerfile: ../../deploy/frontend/farmer/Dockerfile
    ports:
      - "5174:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata: